name: hdd-lab

# ════════════════════════════════════════════════════════════════════════════
# Hand-labs ORSYS HDD « Hadoop, développement » — démarrage (voir README) :
#   docker compose --profile full up -d --build       -> tous les TP (Zeppelin, Hue, HBase, Impala, Spark)
#   docker compose --profile zeppelin up -d --build   -> TP1, TP2, TP4 sans Hue/Impala, TP5 sans Impala
#   docker compose up -d --build                      -> socle seul : HDFS, YARN, JobHistory, Tez, Hive
# Profils disponibles : spark, zeppelin, hbase, impala, hue, full (= tous), llap (bonus)
# Arrêt complet :  docker compose --profile full --profile llap down -v
# ════════════════════════════════════════════════════════════════════════════

# ════════════════════════════════════════════════════════════════════════════
# Ressources — machine cible : 4 CPU minimum (8 conseillés), 16 Go de RAM
# alloués à Docker minimum (24 Go conseillés) pour le profil full.
# Machine plus petite : docker-compose-light.yml (plafonds plus serrés).
#
# 1. Plafonds par conteneur
#    cpus      : temps CPU maximum (1.0 = un cœur). Les JVM (JDK 11/17) s'y
#                adaptent : threads du GC, pools parallèles.
#    mem_limit : mémoire maximum. Au-delà, le noyau tue le conteneur
#                (code de sortie 137, "OOMKilled" dans docker inspect).
#    Docker refuse de créer un conteneur dont cpus dépasse le nombre de CPU
#    de la machine : le plus gros plafond ici est 3.0.
#
# 2. Tas Java alignés sur les plafonds
#    Le -Xmx de chaque démon occupe 50 à 70 % du plafond ; le reste couvre
#    la métaspace, les piles de threads et les tampons natifs. Sans réglage
#    explicite, une JVM prend 1/4 du plafond (ou 1/4 de la RAM de l'hôte si
#    le conteneur n'a pas de plafond).
#      Hadoop (HDFS, YARN, JobHistory) : HADOOP_HEAPSIZE_MAX
#      Hive : SERVICE_OPTS -Xmx      HBase : HBASE_HEAPSIZE
#      Spark : SPARK_DAEMON_MEMORY   ZooKeeper : ZK_SERVER_HEAP (Mo)
#      Impala : -mem_limit (impalad), JAVA_TOOL_OPTIONS -Xmx (JVM embarquée)
#      Zeppelin : ZEPPELIN_MEM (serveur), ZEPPELIN_INTP_MEM (interpréteurs)
#
# 3. Conteneurs qui hébergent des calculs
#    nodemanager  : les conteneurs YARN (AM et tâches MapReduce/Tez) tournent
#                   DANS ce conteneur -> plafond = capacité YARN + démon.
#    spark-worker : les exécuteurs Spark tournent DANS ce conteneur.
#    zeppelin     : serveur + driver Spark + une JVM par interpréteur.
#    Ces deux premiers ont un poids CPU réduit (cpu_shares 512, contre 1024
#    par défaut) : quand la machine sature, NameNode, ResourceManager,
#    HiveServer2 et les consoles passent avant les tâches de calcul.
#
# 4. Healthchecks sans JVM
#    NameNode et ResourceManager sont sondés par curl (API REST) et non par
#    "hdfs dfsadmin" / "yarn node -list", qui lançaient une JVM complète
#    toutes les 10 s (1 à 2 s de CPU et ~200 Mo à chaque fois).
#
# Plafonds mémoire cumulés des services permanents (hors one-shot) :
#   défaut (HDFS, YARN, JobHistory, Hive)  11,5 Go
#   + spark ......................... +6,5 Go
#   + zeppelin (spark inclus) ....... +6 Go    -> profil zeppelin : 24 Go
#   + hbase (zookeeper inclus) ...... +3,25 Go
#   + impala ........................ +4,4 Go
#   + hue ........................... +1,9 Go
#   full ............................ 33,5 Go de plafonds. Un plafond est un
#                                     maximum, pas une réservation : la
#                                     consommation réelle en TP est bien plus
#                                     basse (estimation : 14 à 18 Go). Mesure :
#                                     docker stats --no-stream
#   llap (bonus, zookeeper inclus) .. +5,5 Go : à combiner avec le profil par
#                                     défaut (17 Go), pas avec full.
#   one-shot (tez-init, lab-init, hbase-init) : 0,75 à 1 Go chacun, le temps
#                                     de l'initialisation.
#
# Les plafonds CPU ne se cumulent pas comme la mémoire : ils empêchent un
# conteneur de monopoliser la machine, le temps CPU restant partagé entre tous.
# ════════════════════════════════════════════════════════════════════════════

services:

  # ══════════════════════════════════════════════════════════════════════════
  # Cluster Hadoop (HDFS + YARN) + Tez — construit depuis ./hadoop
  # Point de départ : https://github.com/crystalloide/hadoop-tez-docker
  # HADOOP_HEAPSIZE_MAX fixe le -Xmx des démons ET des commandes clientes
  # (hdfs dfs, yarn...) lancées dans le même conteneur.
  # ══════════════════════════════════════════════════════════════════════════

  namenode:
    build: ./hadoop
    hostname: namenode
    container_name: namenode
    cpus: 1.0
    mem_limit: 1280m
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"
    env_file:
      - ./hadoop/config
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-root/dfs/name"
      HADOOP_HEAPSIZE_MAX: "512m"
    volumes:
      - ./data:/opt/data:ro
      - ./scripts:/opt/scripts:ro
    healthcheck:
      # "healthy" dès que le NameNode est démarré (état "active") : le
      # DataNode peut alors s'enregistrer, ce qui fait sortir le NameNode du
      # safe mode. Les services qui écrivent sur HDFS attendent tez-init, qui
      # attend lui-même la sortie du safe mode (init-tez.sh). Exiger ici
      # "Safe mode is OFF" bloquerait un redémarrage (docker compose stop
      # puis up) : un HDFS non vide reste en safe mode tant que le DataNode
      # n'a pas déclaré ses blocs, et le DataNode attend ce healthcheck.
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9870/jmx?qry=Hadoop:service=NameNode,name=NameNodeStatus' | grep -Eq '\"State\" *: *\"active\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  datanode:
    build: ./hadoop
    hostname: datanode
    container_name: datanode
    cpus: 1.0
    mem_limit: 768m
    command: ["hdfs", "datanode"]
    ports:
      - "9864:9864"
    env_file:
      - ./hadoop/config
    environment:
      HADOOP_HEAPSIZE_MAX: "384m"
    depends_on:
      namenode:
        condition: service_healthy

  resourcemanager:
    build: ./hadoop
    hostname: resourcemanager
    container_name: resourcemanager
    cpus: 1.0
    mem_limit: 1g
    command: ["yarn", "resourcemanager"]
    ports:
      - "8088:8088"
    env_file:
      - ./hadoop/config
    environment:
      HADOOP_HEAPSIZE_MAX: "512m"
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck:
      # "healthy" seulement quand au moins un NodeManager est bien enregistré
      # et RUNNING (API REST du ResourceManager, sans lancer de JVM)
      test: ["CMD-SHELL", "curl -fs 'http://localhost:8088/ws/v1/cluster/nodes?states=RUNNING' | grep -q RUNNING"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  nodemanager:
    build: ./hadoop
    hostname: nodemanager
    container_name: nodemanager
    # Les conteneurs YARN (AM et tâches MapReduce/Tez, 512 Mo chacun) tournent
    # DANS ce conteneur : plafond = capacité annoncée à YARN (NM_MEMORY_MB,
    # 4 Go) + ~1 Go pour le démon NodeManager et la mémoire hors tas des JVM.
    # pmem-check est désactivé (./hadoop/config) : c'est ce plafond qui borne
    # réellement la mémoire des tâches.
    # Si NM_MEMORY_MB est augmenté, augmenter NM_MEM_LIMIT d'autant :
    #   NM_MEMORY_MB=6144 NM_MEM_LIMIT=7g docker compose up -d nodemanager
    cpus: 3.0
    cpu_shares: 512
    mem_limit: ${NM_MEM_LIMIT:-5g}
    command: ["yarn", "nodemanager"]
    ports:
      - "8042:8042"
    env_file:
      - ./hadoop/config
    environment:
      HADOOP_HEAPSIZE_MAX: "384m"
      # Capacité annoncée à YARN par le NodeManager, réglable au lancement
      # (TP YARN) :  NM_MEMORY_MB=2048 docker compose up -d nodemanager
      # vcores : unités de comptabilité YARN (8 pour 3 CPU réels : les tâches
      # du lab attendent surtout les E/S), pas des cœurs physiques.
      YARN-SITE.XML_yarn.nodemanager.resource.memory-mb: "${NM_MEMORY_MB:-4096}"
      YARN-SITE.XML_yarn.nodemanager.resource.cpu-vcores: "${NM_VCORES:-8}"
    depends_on:
      namenode:
        condition: service_healthy
      resourcemanager:
        condition: service_started

  # JobHistory Server MapReduce (ajout HDD) : historique des jobs terminés
  # (compteurs, tâches, journaux agrégés) — http://localhost:19888
  historyserver:
    build: ./hadoop
    hostname: historyserver
    container_name: historyserver
    cpus: 0.5
    mem_limit: 768m
    command: ["mapred", "historyserver"]
    ports:
      - "19888:19888"
    env_file:
      - ./hadoop/config
    environment:
      HADOOP_HEAPSIZE_MAX: "384m"
    depends_on:
      namenode:
        condition: service_healthy
      tez-init:
        # /tmp ouvert en écriture (1777) avant que le JHS y crée ses répertoires
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:19888/ws/v1/history/info > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Service one-shot : attend la sortie du safe mode, dépose le tarball Tez
  # sur HDFS, prépare les répertoires partagés, puis s'arrête
  tez-init:
    build: ./hadoop
    hostname: tez-init
    container_name: tez-init
    cpus: 1.0
    mem_limit: 768m
    command: ["/bin/bash", "/opt/init-tez.sh"]
    env_file:
      - ./hadoop/config
    environment:
      HADOOP_HEAPSIZE_MAX: "256m"
    volumes:
      - ./hadoop/init-tez.sh:/opt/init-tez.sh:ro
    depends_on:
      namenode:
        condition: service_healthy
    restart: "no"

  # ══════════════════════════════════════════════════════════════════════════
  # Hive (image officielle apache/hive) — metastore + hiveserver2
  # Tas fixés par SERVICE_OPTS (-Xmx) : plafond = tas + 50 à 75 %.
  # ══════════════════════════════════════════════════════════════════════════

  metastore:
    build: ./hive
    image: hdd-lab/hive-fixed:4.1.0
    hostname: metastore
    container_name: metastore
    cpus: 1.0
    mem_limit: 1g
    environment:
      SERVICE_NAME: metastore
      SERVICE_OPTS: -Xmx512m
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
    volumes:
      - ./hive-conf:/hive_custom_conf:ro
    depends_on:
      tez-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9083'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  hiveserver2:
    build: ./hive
    image: hdd-lab/hive-fixed:4.1.0
    hostname: hiveserver2
    container_name: hiveserver2
    # Compilation des requêtes et client Tez ; les tâches Tez elles-mêmes
    # tournent dans le nodemanager.
    cpus: 2.0
    mem_limit: 1792m
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      SERVICE_OPTS: -Xmx1G -Dhive.metastore.uris=thrift://metastore:9083
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - ./hive-conf:/hive_custom_conf:ro
      - ./scripts:/opt/scripts:ro
    depends_on:
      metastore:
        condition: service_healthy
      resourcemanager:
        condition: service_healthy
      tez-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/10000'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  # ══════════════════════════════════════════════════════════════════════════
  # BONUS (optionnel) — Tez + LLAP en mode autonome (sans YARN), inspiré de
  # l'environnement officiel packaging/src/docker du projet Apache Hive.
  # Activation : docker compose --profile llap up -d
  # ══════════════════════════════════════════════════════════════════════════

  # ZooKeeper est partagé : bonus LLAP (enregistrement Tez AM / démons LLAP) ET
  # HBase (coordination master / RegionServers). Il démarre avec l'un ou l'autre.
  zookeeper:
    profiles: ["llap", "hbase", "full"]
    image: zookeeper:3.8.4
    container_name: zookeeper
    hostname: zookeeper
    cpus: 0.5
    mem_limit: 512m
    ports:
      - "2181:2181"
    environment:
      # ruok : healthcheck ; srvr/stat/mntr : page "ZooKeeper dump" de l'UI HBase
      ZOO_4LW_COMMANDS_WHITELIST: "ruok,srvr,stat,mntr"
      # Tas du serveur en Mo (1000 par défaut, surdimensionné pour l'atelier)
      ZK_SERVER_HEAP: "256"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 127.0.0.1 2181 | grep imok"]
      interval: 5s
      timeout: 3s
      retries: 30

  tezam:
    profiles: ["llap"]
    build: ./hive
    image: hdd-lab/hive-fixed:4.1.0
    container_name: tezam
    hostname: tezam
    cpus: 1.0
    mem_limit: 1536m
    depends_on:
      zookeeper:
        condition: service_healthy
    restart: on-failure:3
    environment:
      USER: hive
      SERVICE_NAME: tezam
      TEZ_FRAMEWORK_MODE: STANDALONE_ZOOKEEPER
      TEZ_AM_ZOOKEEPER_QUORUM: zookeeper:2181
      TEZ_AM_RPC_PORT: "15100"
      HIVE_ZOOKEEPER_QUORUM: zookeeper:2181
      HIVE_LLAP_DAEMON_SERVICE_HOSTS: "@llap0"
      DEFAULT_FS: hdfs://namenode:8020
      HIVE_WAREHOUSE_PATH: /user/hive/warehouse
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/15100'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  llapdaemon:
    profiles: ["llap"]
    build: ./hive
    image: hdd-lab/hive-fixed:4.1.0
    container_name: llapdaemon
    # LLAP_MEMORY_MB (1 Go) + marge pour la mémoire hors tas du démon
    cpus: 2.0
    cpu_shares: 512
    mem_limit: 2g
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      USER: hive
      SERVICE_NAME: llap
      LLAP_MEMORY_MB: "1024"
      LLAP_EXECUTORS: "1"
      HIVE_ZOOKEEPER_QUORUM: zookeeper:2181
      DEFAULT_FS: hdfs://namenode:8020
      HIVE_WAREHOUSE_PATH: /user/hive/warehouse
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/15001'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  hiveserver2-llap:
    profiles: ["llap"]
    build: ./hive
    image: hdd-lab/hive-fixed:4.1.0
    hostname: hiveserver2-llap
    container_name: hiveserver2-llap
    cpus: 1.0
    mem_limit: 1536m
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      SERVICE_OPTS: >-
        -Xmx1G
        -Dhive.metastore.uris=thrift://metastore:9083
        -Dhive.zookeeper.quorum=zookeeper:2181
        -Dhive.llap.daemon.service.hosts=@llap0
      HIVE_ZOOKEEPER_QUORUM: zookeeper:2181
      HIVE_LLAP_DAEMON_SERVICE_HOSTS: "@llap0"
      HIVE_SERVER2_TEZ_USE_EXTERNAL_SESSIONS: "true"
      TEZ_FRAMEWORK_MODE: STANDALONE_ZOOKEEPER
      DEFAULT_FS: hdfs://namenode:8020
      HIVE_WAREHOUSE_PATH: /user/hive/warehouse
    ports:
      - "10001:10000"
      - "10012:10002"
    depends_on:
      metastore:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/10000'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  # ══════════════════════════════════════════════════════════════════════════
  # Données de démonstration (toujours actif) — one-shot : sales_db.transactions
  # sur HDFS + metastore, utilisée par le TP Zeppelin N1, Hue, Impala, Spark.
  # ══════════════════════════════════════════════════════════════════════════

  lab-init:
    build: ./hive
    image: hdd-lab/hive-fixed:4.1.0
    container_name: lab-init
    hostname: lab-init
    # Clients hdfs et beeline uniquement (tas JVM par défaut : 1/4 du plafond)
    cpus: 1.0
    mem_limit: 1g
    entrypoint: ["bash", "/opt/scripts/lab-init.sh"]
    volumes:
      - ./hive-conf:/hive_custom_conf:ro
      - ./data:/opt/data:ro
      - ./scripts:/opt/scripts:ro
    depends_on:
      hiveserver2:
        condition: service_healthy
    restart: "no"

  # ══════════════════════════════════════════════════════════════════════════
  # Apache Spark 4.0.4 — cluster "standalone" (profils : spark, zeppelin, full)
  # Image : spark/Dockerfile (cible "spark"), catalogue = metastore Hive partagé
  # SPARK_DAEMON_MEMORY : tas des démons (master, worker, history), pas des
  # exécuteurs (spark.executor.memory = 1g, spark/conf/spark-defaults.conf).
  # ══════════════════════════════════════════════════════════════════════════

  spark-master:
    profiles: ["spark", "zeppelin", "full"]
    build:
      context: .
      dockerfile: spark/Dockerfile
      target: spark
    image: hdd-lab/spark:4.0.4
    container_name: spark-master
    hostname: spark-master
    cpus: 0.5
    mem_limit: 768m
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    environment:
      SPARK_DAEMON_MEMORY: 512m
    ports:
      - "8080:8080"
    volumes:
      - ./scripts:/opt/scripts:ro
      - ./data:/opt/data:ro
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/json/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  spark-worker:
    profiles: ["spark", "zeppelin", "full"]
    build:
      context: .
      dockerfile: spark/Dockerfile
      target: spark
    image: hdd-lab/spark:4.0.4
    container_name: spark-worker
    hostname: spark-worker
    # Les exécuteurs Spark tournent DANS ce conteneur : démon (512m) + 3 Go
    # d'exécuteurs (--memory, soit 3 exécuteurs de 1 Go) + mémoire hors tas
    # des exécuteurs (~400 Mo chacun) + processus Python de PySpark.
    # --cores 4 : cœurs logiques offerts aux applications (2 par application
    # avec spark.cores.max = 2), exécutés sur 3 CPU réels au plus.
    cpus: 3.0
    cpu_shares: 512
    mem_limit: 5g
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "--cores", "4", "--memory", "3g", "--webui-port", "8081",
              "spark://spark-master:7077"]
    environment:
      SPARK_DAEMON_MEMORY: 512m
    ports:
      - "8081:8081"
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/json/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  spark-history:
    profiles: ["spark", "zeppelin", "full"]
    build:
      context: .
      dockerfile: spark/Dockerfile
      target: spark
    image: hdd-lab/spark:4.0.4
    container_name: spark-history
    hostname: spark-history
    cpus: 0.5
    mem_limit: 768m
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.history.HistoryServer"]
    environment:
      SPARK_DAEMON_MEMORY: 512m
    ports:
      - "18080:18080"
    depends_on:
      namenode:
        condition: service_healthy
      tez-init:
        # /spark-logs doit exister sur HDFS avant le démarrage (créé par init-tez.sh)
        condition: service_completed_successfully

  # ══════════════════════════════════════════════════════════════════════════
  # Apache Zeppelin 0.12.1 (profils : zeppelin, full)
  # Interpréteurs préconfigurés : %spark / %spark.pyspark / %spark.sql (Spark
  # 4.0.4 du cluster), %hive (HiveServer2), %impala, %sh (client hdfs/yarn),
  # %python (happybase -> HBase), %md, Pig (%sh). Notebooks : dossier HDD (TP1 à TP5, énoncés et corrigés)
  # ══════════════════════════════════════════════════════════════════════════

  zeppelin:
    profiles: ["zeppelin", "full"]
    build:
      context: .
      dockerfile: spark/Dockerfile
      target: zeppelin
    image: hdd-lab/zeppelin:0.12.1
    container_name: zeppelin
    hostname: zeppelin
    # Contient le serveur Zeppelin (768 Mo de tas), le driver Spark (%spark,
    # spark.driver.memory = 1g), une JVM de 512 Mo par interpréteur utilisé
    # (%hive, %impala, %sh, %python...) et les clients lancés depuis %sh
    # (javac, hadoop jar, pig, hbase shell).
    cpus: 2.0
    mem_limit: 6g
    environment:
      # Défauts Zeppelin : 1 Go pour le serveur et 1 Go par interpréteur.
      # ZEPPELIN_INTP_MEM ne s'applique pas au driver Spark.
      # zeppelin/conf/zeppelin-env.sh ne garde ses propres valeurs que si
      # ces variables sont absentes.
      ZEPPELIN_MEM: "-Xms256m -Xmx768m"
      ZEPPELIN_INTP_MEM: "-Xms128m -Xmx512m"
      # Clients lancés depuis %sh : hdfs, yarn, hadoop jar (TP1, TP2, TP4)...
      HADOOP_HEAPSIZE_MAX: "512m"
      # ... et pig (TP4), dont le script fixe sinon -Xmx1000m (valeur en Mo).
      # Le client HBase (hbase shell, TP3) a déjà 512 Mo (hbase-env.sh de l'image).
      PIG_HEAPSIZE: "512"
    ports:
      - "8082:8082"   # UI Zeppelin
      - "4040:4040"   # UI du driver Spark lancé par Zeppelin (quand il tourne)
    volumes:
      # Volume nommé : initialisé au 1er démarrage avec les notebooks de l'image
      # (TP HDD, démo), puis conservé entre deux "docker compose up".
      - zeppelin_notebook:/opt/zeppelin/notebook
      - ./data:/opt/data:ro
      - ./scripts:/opt/scripts:ro
      # Sources des TP HDD (Java, Pig, HiveQL, PySpark, scripts) en lecture seule
      - ./tp:/opt/tp:ro
    depends_on:
      spark-master:
        condition: service_healthy
      hiveserver2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/api/version > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ══════════════════════════════════════════════════════════════════════════
  # Apache HBase 2.6.7 (profils : hbase, full) — données sur HDFS, ZooKeeper
  # partagé avec le bonus LLAP. Image : hbase/Dockerfile
  # HBASE_HEAPSIZE fixe le -Xmx de chaque démon (et du shell dans hbase-init).
  # ══════════════════════════════════════════════════════════════════════════

  hbase-master:
    profiles: ["hbase", "full"]
    build: ./hbase
    image: hdd-lab/hbase:2.6.7
    container_name: hbase-master
    hostname: hbase-master
    cpus: 1.0
    mem_limit: 1g
    # Nom d'hôte annoncé explicite (hbase.master.hostname ; côté RegionServer :
    # hbase.unsafe.regionserver.hostname, nom de la clé depuis HBase 2.4) : sans
    # lui, HBase utiliserait le nom DNS inverse fourni par Docker
    # ("hbase-master.hdd-lab_default"), dont le "_" est refusé par
    # certains parseurs d'URL Java.
    command: ["hbase", "master", "-Dhbase.master.hostname=hbase-master", "start"]
    environment:
      HBASE_HEAPSIZE: 512m
    ports:
      - "16010:16010"
    depends_on:
      zookeeper:
        condition: service_healthy
      namenode:
        condition: service_healthy
      tez-init:
        condition: service_completed_successfully
    healthcheck:
      # Le RPC du master écoute sur l'IP du conteneur (adresse de "hbase-master"),
      # PAS sur localhost : on teste donc le nom d'hôte, pas 127.0.0.1.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/hbase-master/16000'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  hbase-regionserver:
    profiles: ["hbase", "full"]
    build: ./hbase
    image: hdd-lab/hbase:2.6.7
    container_name: hbase-regionserver
    hostname: hbase-regionserver
    # Tas (memstore + block cache) + tampons réseau hors tas
    cpus: 1.5
    mem_limit: 1280m
    command: ["hbase", "regionserver", "-Dhbase.unsafe.regionserver.hostname=hbase-regionserver", "start"]
    environment:
      HBASE_HEAPSIZE: 768m
    ports:
      - "16030:16030"
    depends_on:
      hbase-master:
        condition: service_healthy
    healthcheck:
      # Même remarque que pour le master : RPC lié à l'IP de "hbase-regionserver"
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/hbase-regionserver/16020'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Serveur Thrift v1 : utilisé par l'explorateur HBase de Hue et par happybase
  hbase-thrift:
    profiles: ["hbase", "full"]
    build: ./hbase
    image: hdd-lab/hbase:2.6.7
    container_name: hbase-thrift
    hostname: hbase-thrift
    cpus: 0.5
    mem_limit: 512m
    command: ["hbase", "thrift", "start", "-p", "9090", "--infoport", "9095"]
    environment:
      HBASE_HEAPSIZE: 256m
    ports:
      - "9090:9090"
      - "9095:9095"
    depends_on:
      hbase-regionserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9090'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # One-shot : attend qu'HBase soit opérationnel puis crée la table "clients_hbase"
  hbase-init:
    profiles: ["hbase", "full"]
    build: ./hbase
    image: hdd-lab/hbase:2.6.7
    container_name: hbase-init
    hostname: hbase-init
    cpus: 1.0
    mem_limit: 768m
    command: ["bash", "/opt/hbase-scripts/init-hbase.sh"]
    environment:
      HBASE_HEAPSIZE: 384m
    # Scripts montés (ils sont aussi copiés dans l'image) : une modification
    # s'applique par « docker compose up -d hbase-init », sans reconstruire
    # l'image HBase ni redémarrer le master et le RegionServer.
    volumes:
      - ./hbase/init-hbase.sh:/opt/hbase-scripts/init-hbase.sh:ro
      - ./hbase/demo_clients.hbase:/opt/hbase-scripts/demo_clients.hbase:ro
    depends_on:
      hbase-regionserver:
        condition: service_healthy
    restart: "no"

  # ══════════════════════════════════════════════════════════════════════════
  # Apache Impala 4.5.2 (profils : impala, full) — images officielles
  # apache/impala. Les noms de service "statestored" et "catalogd" sont IMPOSÉS
  # par ces images (-state_store_host=statestored -catalog_service_host=catalogd
  # dans leur ENTRYPOINT). Catalogue = metastore Hive partagé, données sur HDFS.
  # ══════════════════════════════════════════════════════════════════════════

  statestored:
    profiles: ["impala", "full"]
    image: apache/impala:4.5.2-statestored
    container_name: statestored
    hostname: statestored
    # Démon C++ léger (diffusion des mises à jour du catalogue)
    cpus: 0.5
    mem_limit: 384m
    command: ["-redirect_stdout_stderr=false", "-logtostderr"]
    ports:
      - "25010:25010"
    volumes:
      - ./impala/conf:/opt/impala/conf:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/24000'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  catalogd:
    profiles: ["impala", "full"]
    image: apache/impala:4.5.2-catalogd
    container_name: catalogd
    hostname: catalogd
    # Démon C++ + JVM embarquée (-Xmx1g)
    cpus: 1.0
    mem_limit: 1536m
    command: ["-redirect_stdout_stderr=false", "-logtostderr"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx1g"
    ports:
      - "25020:25020"
    volumes:
      - ./impala/conf:/opt/impala/conf:ro
    depends_on:
      statestored:
        condition: service_healthy
      metastore:
        condition: service_healthy
      namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/26000'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  impalad:
    profiles: ["impala", "full"]
    # Image officielle apache/impala:4.5.2-impalad_coord_exec + correctif
    # IMPALA-10792 (tables Hive 4 refusées : « access type is: NONE »).
    # Voir impala/Dockerfile et impala/patch/.
    build:
      context: ./impala
      target: impalad
    image: hdd-lab/impalad:4.5.2
    container_name: impalad
    hostname: impalad
    # Plafond = -mem_limit (2g, JVM comprise) + 512 Mo de mémoire non suivie
    # par Impala. Garder mem_limit du conteneur > -mem_limit si l'un change.
    cpus: 2.0
    mem_limit: 2560m
    command: ["-redirect_stdout_stderr=false", "-logtostderr", "-mem_limit=2g"]
    environment:
      # Le tas Java est compté dans mem_limit (-mem_limit_includes_jvm=true)
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    ports:
      - "21050:21050"   # HiveServer2 (JDBC/ODBC, Hue, Zeppelin)
      - "25000:25000"   # UI impalad
    volumes:
      - ./impala/conf:/opt/impala/conf:ro
    depends_on:
      catalogd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/21050'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ══════════════════════════════════════════════════════════════════════════
  # Hue 4.11.0 (profils : hue, full) — éditeurs Hive & Impala, HDFS, YARN, HBase
  # Base de données Hue : PostgreSQL 15 (conteneur hue-db)
  # ══════════════════════════════════════════════════════════════════════════

  hue-db:
    profiles: ["hue", "full"]
    image: postgres:15-alpine
    container_name: hue-db
    hostname: hue-db
    # Base de quelques Mo (sessions, requêtes enregistrées) : réglages
    # PostgreSQL par défaut (shared_buffers = 128 Mo)
    cpus: 0.5
    mem_limit: 384m
    environment:
      POSTGRES_USER: hue
      POSTGRES_PASSWORD: hue
      POSTGRES_DB: hue
    volumes:
      - hue_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hue -d hue"]
      interval: 5s
      timeout: 5s
      retries: 30

  hue:
    profiles: ["hue", "full"]
    # Image officielle gethue/hue:4.11.0 + cookie CSRF propre à l'atelier et
    # compte administrateur créé d'avance (voir hue/Dockerfile).
    build: ./hue
    image: hdd-lab/hue:4.11.0
    container_name: hue
    hostname: hue
    # Serveur web Python (Django) : la mémoire croît avec le nombre de
    # sessions ouvertes (un stagiaire = une session)
    cpus: 1.0
    mem_limit: 1536m
    environment:
      # Compte principal : hue / hue, administrateur (accès complet).
      # C'est l'utilisateur interne de Hue, activé au démarrage (hue/atelier_hue_user.py).
      HUE_USER_PASSWORD: hue
      # Compte de secours (sa présence évite l'écran « Create your account »).
      HUE_ADMIN_USER: admin
      HUE_ADMIN_PASSWORD: admin
    ports:
      - "8888:8888"
    volumes:
      - ./hue/z-hue.ini:/usr/share/hue/desktop/conf/z-hue.ini:ro
      - ./hue/hive-conf:/etc/hive/conf:ro
    depends_on:
      hue-db:
        condition: service_healthy
      hiveserver2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8888/desktop/debug/is_alive > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  zeppelin_notebook:
  hue_db_data:

# ════════════════════════════════════════════════════════════════════════════
# Réseau : nom explicite SANS « _ ».
# Le DNS de Docker répond aux résolutions inverses par <conteneur>.<réseau>.
# Avec le nom par défaut « hdd-lab_default », certains clients Java
# obtiennent un nom d'hôte invalide (« _ » interdit par java.net.URI) :
#   - catalogd (client metastore CDP d'Impala) : URISyntaxException sur
#     thrift://metastore.hdd-lab_default:9083, puis arrêt ;
#   - HBase, Spark : même famille de problèmes (noms d'hôtes publiés).
# ════════════════════════════════════════════════════════════════════════════
networks:
  default:
    name: hdd-lab-net
