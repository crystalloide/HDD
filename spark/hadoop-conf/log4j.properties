# =============================================================================
# Journalisation des clients Hadoop 3.4.2 lancés dans Zeppelin (%sh) et dans
# les conteneurs Spark : hdfs, yarn, mapred, hadoop jar / yarn jar.
#
# Sans ce fichier, chaque commande affiche « WARNING: log4j.properties is not
# found. HADOOP_CONF_DIR may be incomplete. » et le client MapReduce n'écrit
# rien : ni progression (map x% reduce y%), ni compteurs, ni cause d'échec.
#
# Niveau racine WARN : les commandes hdfs restent lisibles dans les notebooks
# (pas de lignes INFO à chaque lecture ou écriture). Seul le suivi des jobs
# MapReduce est en INFO. Les messages vont sur la sortie d'erreur (stderr).
#
# Sans effet sur Spark, HBase et Hue (log4j2, configurations propres) ni sur
# Pig, qui installe sa propre configuration au démarrage.
# =============================================================================

log4j.rootLogger=WARN, console
log4j.threshold=ALL

log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{HH:mm:ss} %p %c{1}: %m%n

# Suivi d'un job MapReduce : soumission, progression, état final, compteurs
log4j.logger.org.apache.hadoop.yarn.client.api.impl.YarnClientImpl=INFO
log4j.logger.org.apache.hadoop.mapreduce.JobSubmitter=INFO
log4j.logger.org.apache.hadoop.mapreduce.lib.input.FileInputFormat=INFO
log4j.logger.org.apache.hadoop.mapreduce.Job=INFO

# Avertissements sans intérêt dans l'atelier
log4j.logger.org.apache.hadoop.util.NativeCodeLoader=ERROR
